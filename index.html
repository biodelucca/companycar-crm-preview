<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#111111" />
<title>Companycar CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d62828'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
<style>
#banner-preview { background: #111114; color: #fff; font-size: 12px; text-align: center; padding: 6px 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
#banner-preview strong { color: #ffb703; }
</style>
<style>
:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --cor-primaria: #d62828;
  --cor-primaria-escura: #a81f1f;
  --cor-fundo: #f5f5f7;
  --cor-texto: #111114;
  --cor-texto-suave: #6b6b70;
  --cor-borda: #e3e3e6;
  --sombra-card: 0 1px 2px rgba(0, 0, 0, 0.06), 0 1px 1px rgba(0, 0, 0, 0.04);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cor-fundo);
  color: var(--cor-texto);
}

button {
  font-family: inherit;
}

/* ---------- Layout / cabeçalho ---------- */

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 24px;
  background: #fff;
  border-bottom: 1px solid var(--cor-borda);
  position: sticky;
  top: 0;
  z-index: 20;
}

.app-header__brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  white-space: nowrap;
}

.app-header__logo {
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
}

.app-header__badge {
  font-size: 11px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 999px;
  padding: 2px 8px;
}

.app-nav {
  display: flex;
  gap: 4px;
  flex: 1;
  justify-content: center;
}

.app-nav button {
  text-decoration: none;
  color: var(--cor-texto-suave);
  font-size: 14px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 8px;
  background: none;
  border: none;
  cursor: pointer;
}

.app-nav button.ativo {
  color: var(--cor-primaria);
  background: rgba(214, 40, 40, 0.08);
}

.app-header__usuario {
  display: flex;
  align-items: center;
  gap: 12px;
}

.app-header__avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--cor-primaria);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
}

.app-header__menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  width: 34px;
  height: 34px;
  font-size: 16px;
  cursor: pointer;
}

.app-content {
  flex: 1;
  min-width: 0;
}

/* ---------- Dashboard ---------- */

.dashboard {
  padding: 24px;
  max-width: 960px;
  margin: 0 auto;
}

.dashboard h1 {
  margin: 0 0 4px;
  font-size: 24px;
}

.dashboard__subtitulo {
  margin: 0 0 24px;
  color: var(--cor-texto-suave);
}

.dashboard__cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.dashboard__card {
  background: #fff;
  border: 1px solid var(--cor-borda);
  border-radius: 12px;
  padding: 16px;
  box-shadow: var(--sombra-card);
}

.dashboard__card-label {
  display: block;
  font-size: 12px;
  color: var(--cor-texto-suave);
  margin-bottom: 6px;
}

.dashboard__card-valor {
  font-size: 26px;
  font-weight: 700;
}

.dashboard__card-valor small {
  font-size: 14px;
  font-weight: 500;
  color: var(--cor-texto-suave);
}

.dashboard__barra {
  margin-top: 10px;
  height: 6px;
  border-radius: 999px;
  background: var(--cor-fundo);
  overflow: hidden;
}

.dashboard__barra-preenchida {
  height: 100%;
  background: var(--cor-primaria);
}

.dashboard__cta {
  display: inline-block;
  background: var(--cor-primaria);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.dashboard__cta:hover {
  background: var(--cor-primaria-escura);
}

/* ---------- Dashboard: filtros (Sprint 2) ---------- */
/* Estrutura mínima pedida pelo CEO — período/responsável/origem, sem UI
   avançada (datepicker custom etc). Mesmo visual de campo já usado em
   .side-panel__form, repetido aqui para não acoplar o Dashboard ao
   SidePanel só por causa de CSS. */

.dashboard__filtros {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
}

.dashboard__filtros label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.dashboard__filtros select {
  padding: 8px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13.5px;
  font-family: inherit;
  background: #fff;
  color: var(--cor-texto);
  min-width: 180px;
}

/* ---------- Dashboard: indicadores (Sprint 2) ---------- */

.dashboard__secao {
  background: #fff;
  border: 1px solid var(--cor-borda);
  border-radius: 12px;
  padding: 16px;
  box-shadow: var(--sombra-card);
  margin-bottom: 20px;
}

.dashboard__secao-titulo {
  margin: 0 0 12px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--cor-texto-suave);
}

.dashboard__grade-indicadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.dashboard__grade-indicadores .dashboard__secao {
  margin-bottom: 0;
}

.dashboard__vazio {
  margin: 0;
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

.dashboard__lista-contagem {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dashboard__lista-contagem li {
  display: grid;
  grid-template-columns: minmax(80px, 1fr) minmax(60px, 2fr) auto;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}

.dashboard__lista-contagem-rotulo {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dashboard__lista-contagem-barra {
  display: block;
  height: 6px;
  border-radius: 999px;
  background: var(--cor-fundo);
  overflow: hidden;
}

.dashboard__lista-contagem-barra-preenchida {
  display: block;
  height: 100%;
  background: var(--cor-primaria);
}

.dashboard__lista-contagem-valor {
  font-weight: 700;
  text-align: right;
  min-width: 20px;
}

.dashboard__lista-acoes {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.dashboard__lista-acoes li {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--cor-borda);
}

.dashboard__lista-acoes li:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.dashboard__lista-acoes-principal {
  font-size: 13.5px;
  font-weight: 600;
}

.dashboard__lista-acoes-detalhe {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

/* ---------- Pipeline ---------- */

.pipeline-loading {
  padding: 24px;
  color: var(--cor-texto-suave);
}

/* Sprint 3.5 "Nova Negociação" — barra no topo do Pipeline com o botão
   "+ Nova Negociação" (critério de aceite: botão sempre visível ali). */
.pipeline__topo {
  display: flex;
  justify-content: flex-end;
  padding: 14px 16px 0;
}

.pipeline__botao-nova {
  background: var(--cor-primaria);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 16px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.pipeline__botao-nova:hover {
  background: var(--cor-primaria-escura);
}

.pipeline__board {
  display: flex;
  gap: 14px;
  padding: 16px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
}

.pipeline__coluna {
  flex: 0 0 260px;
  scroll-snap-align: start;
  background: #eef0f2;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 120px);
}

.pipeline__coluna--ganho {
  background: #e7f5ea;
}

.pipeline__coluna--perdido {
  background: #f5e9e9;
}

/* Sprint 1 — drag-and-drop (desktop): destaque da coluna sob o card
   arrastado, ver handleDragOverColuna/handleDropColuna em Pipeline.tsx. */
.pipeline__coluna--sobre {
  outline: 2px dashed var(--cor-primaria);
  outline-offset: -4px;
  background: #fdeded;
}

.pipeline__aviso-acao {
  margin: 12px 16px 0;
  padding: 8px 14px;
  background: #fdeded;
  border: 1px solid #f3caca;
  border-radius: 8px;
  color: var(--cor-primaria-escura);
  font-size: 13px;
}

.pipeline__coluna-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px 6px;
}

.pipeline__coluna-header h2 {
  font-size: 13px;
  font-weight: 700;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--cor-texto-suave);
}

.pipeline__contagem {
  font-size: 12px;
  font-weight: 700;
  background: #fff;
  border-radius: 999px;
  padding: 1px 8px;
  color: var(--cor-texto-suave);
}

.pipeline__coluna-cards {
  padding: 4px 10px 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pipeline__vazio {
  font-size: 12px;
  color: var(--cor-texto-suave);
  padding: 8px 4px;
}

.op-card {
  background: #fff;
  border: 1px solid var(--cor-borda);
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  box-shadow: var(--sombra-card);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.op-card:hover {
  border-color: var(--cor-primaria);
}

/* Sprint 1 — drag-and-drop (desktop only, ver arrastavel em
   OpportunityCard.tsx/Pipeline.tsx). */
.op-card--arrastavel {
  cursor: grab;
}

.op-card--arrastavel:active {
  cursor: grabbing;
}

/* Sprint 3.5 "Nova Negociação" — destaque temporário do card recém-criado
   (ver destaqueId em Pipeline.tsx, que liga isto por 4s e depois limpa
   sozinho). Anima só o outline/sombra, não o layout — não empurra os
   cards vizinhos. */
.op-card--destaque {
  outline: 2px solid var(--cor-primaria);
  outline-offset: 1px;
  animation: op-card-destaque 1.6s ease-in-out 2;
}

@keyframes op-card-destaque {
  0%,
  100% {
    box-shadow: var(--sombra-card);
  }
  50% {
    box-shadow: 0 0 0 4px rgba(214, 40, 40, 0.18);
  }
}

.op-card__veiculo {
  font-size: 13.5px;
}

.op-card__cliente {
  margin: 0;
  font-size: 12.5px;
  color: var(--cor-texto);
}

.op-card__proxima {
  margin: 0;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.op-card__valor {
  margin-top: 4px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--cor-primaria-escura);
}

/* ---------- Painel lateral ---------- */

.side-panel__overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  justify-content: flex-end;
  z-index: 30;
}

.side-panel {
  width: min(420px, 100%);
  height: 100%;
  background: #fff;
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 16px rgba(0, 0, 0, 0.12);
  animation: side-panel-in 0.18s ease-out;
}

@keyframes side-panel-in {
  from {
    transform: translateX(24px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

.side-panel__header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--cor-borda);
}

.side-panel__header h2 {
  margin: 0 0 4px;
  font-size: 17px;
}

.side-panel__cliente {
  margin: 0;
  color: var(--cor-texto-suave);
  font-size: 13px;
}

.side-panel__fechar {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  color: var(--cor-texto-suave);
}

.side-panel__tabs {
  display: flex;
  gap: 4px;
  padding: 10px 16px 0;
  border-bottom: 1px solid var(--cor-borda);
}

.side-panel__tabs button {
  background: none;
  border: none;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--cor-texto-suave);
  cursor: pointer;
  border-bottom: 2px solid transparent;
}

.side-panel__tabs button.ativo {
  color: var(--cor-primaria);
  border-bottom-color: var(--cor-primaria);
}

.side-panel__body {
  padding: 18px 20px;
  overflow-y: auto;
}

.side-panel__lista {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 16px;
  margin: 0;
}

.side-panel__lista dt {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.side-panel__lista dd {
  margin: 0;
  font-size: 13.5px;
  text-align: right;
}

.side-panel__timeline {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.side-panel__timeline li {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-left: 14px;
  border-left: 2px solid var(--cor-borda);
}

.side-panel__timeline-data {
  font-size: 11px;
  color: var(--cor-texto-suave);
  text-transform: uppercase;
}

.side-panel__checklist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.side-panel__checklist label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
}

/* Ciclo 22 "Funil Comercial — Bloco 1" (2026-08-12) — data/hora de quando o
   item foi marcado, mesmo estilo discreto já usado em .side-panel__timeline-data. */
.side-panel__checklist-data {
  font-size: 11px;
  color: var(--cor-texto-suave);
  margin-left: 24px;
}

.side-panel__vazio-aba {
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

/* ---------- Painel lateral: seções de ação (mover etapa / próxima ação) --- */

.side-panel__secao {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--cor-borda);
}

.side-panel__secao-titulo {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--cor-texto-suave);
}

.side-panel__aviso {
  margin: 0 0 10px;
  font-size: 12px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  padding: 8px 10px;
}

.side-panel__form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.side-panel__form select,
.side-panel__form input[type="text"],
.side-panel__form input[type="date"],
.side-panel__form textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13.5px;
  font-family: inherit;
  background: #fff;
  color: var(--cor-texto);
}

.side-panel__form textarea {
  resize: vertical;
  min-height: 72px;
  line-height: 1.4;
}

.side-panel__anotacoes-status {
  align-self: center;
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

.side-panel__campo {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.side-panel__form-acoes {
  display: flex;
  gap: 8px;
}

.side-panel__botao-primario {
  background: var(--cor-primaria);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.side-panel__botao-primario:hover {
  background: var(--cor-primaria-escura);
}

.side-panel__botao-primario:disabled {
  background: var(--cor-borda);
  color: var(--cor-texto-suave);
  cursor: not-allowed;
}

.side-panel__botao-secundario {
  background: none;
  color: var(--cor-texto);
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.side-panel__botao-secundario:hover {
  border-color: var(--cor-primaria);
  color: var(--cor-primaria);
}

/* Sprint 6 "Operação do dia a dia" (2026-08-07) — item 1 "Excluir
   negociação": botão de ação destrutiva. Como --cor-primaria já é
   vermelha (identidade da marca), usa um vermelho mais escuro e sólido
   para não se confundir com os botões primários normais do painel. */
.side-panel__botao-perigo {
  background: #fff;
  color: #b91c1c;
  border: 1px solid #b91c1c;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.side-panel__botao-perigo:hover {
  background: #b91c1c;
  color: #fff;
}

.side-panel__botao-perigo:disabled {
  background: var(--cor-borda);
  color: var(--cor-texto-suave);
  border-color: var(--cor-borda);
  cursor: not-allowed;
}

/* ---------- Sprint 3: veículo do estoque (busca / associação) ---------- */

.side-panel__veiculo-estoque {
  margin-bottom: 12px;
}

.side-panel__veiculo-estoque-imagem {
  width: 100%;
  max-height: 140px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 10px;
  border: 1px solid var(--cor-borda);
}

.side-panel__estoque-resultados {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 320px;
  overflow-y: auto;
}

.side-panel__estoque-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
}

.side-panel__estoque-item img {
  width: 56px;
  height: 42px;
  object-fit: cover;
  border-radius: 6px;
  flex-shrink: 0;
}

.side-panel__estoque-item-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}

.side-panel__estoque-item-info strong {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.side-panel__estoque-item-info span {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.side-panel__estoque-item .side-panel__botao-primario {
  padding: 7px 10px;
  font-size: 12.5px;
  flex-shrink: 0;
}

/* ---------- Modal de motivo de perda (drag-and-drop -> Perdido) ---------- */
/* Sprint 1 — mesmo padrão visual do side-panel__overlay, mas centralizado
   em vez de ancorado à direita (ver dropPendente em Pipeline.tsx). */

.drop-motivo-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 40;
}

.drop-motivo-modal {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  width: min(360px, 90vw);
  box-shadow: var(--sombra-card);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.drop-motivo-modal h3 {
  margin: 0;
  font-size: 15px;
}

/* ---------- Responsivo ---------- */

@media (max-width: 720px) {
  .app-header {
    padding: 10px 16px;
    flex-wrap: wrap;
  }

  .app-header__menu-btn {
    display: block;
  }

  .app-nav {
    order: 3;
    flex-basis: 100%;
    justify-content: flex-start;
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-top: 8px;
    border-top: 1px solid var(--cor-borda);
    margin-top: 8px;
  }

  .app-nav--aberto {
    display: flex;
  }

  .app-nav button {
    padding: 10px 8px;
    text-align: left;
  }

  .dashboard {
    padding: 16px;
  }

  .dashboard__filtros {
    flex-direction: column;
  }

  .dashboard__filtros select {
    width: 100%;
    min-width: 0;
  }

  .dashboard__lista-contagem li {
    grid-template-columns: minmax(70px, 1fr) minmax(40px, 1.4fr) auto;
    font-size: 12.5px;
  }

  .pipeline__board {
    scroll-snap-type: x mandatory;
  }

  .pipeline__coluna {
    flex-basis: 84vw;
    max-height: calc(100vh - 150px);
  }

  .side-panel {
    width: 100%;
  }

  /* Painel único no celular (2026-08-04): antes lista e conversa ficavam
     espremidas uma em cima da outra (lista fixa em 40vh) — o espaço real
     pra ler mensagens era pequeno demais pra uso diário. Agora
     Conversas.tsx só renderiza um painel por vez (lista OU conversa, com
     botão "← Conversas" pra voltar), então cada um pode ocupar a tela
     inteira. */
  .conversas {
    height: calc(100vh - 61px);
  }

  .conversas__lista {
    width: 100%;
  }

  .conversas__balao {
    max-width: 90%;
  }

  .conversas__thread-header {
    flex-wrap: wrap;
  }

  .conversas__thread-header-acoes {
    width: 100%;
    order: 3;
  }
}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#111111" />
<title>Companycar CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d62828'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
<style>
#banner-preview { background: #111114; color: #fff; font-size: 12px; text-align: center; padding: 6px 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
#banner-preview strong { color: #ffb703; }
</style>
<style>
:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --cor-primaria: #d62828;
  --cor-primaria-escura: #a81f1f;
  --cor-fundo: #f5f5f7;
  --cor-texto: #111114;
  --cor-texto-suave: #6b6b70;
  --cor-borda: #e3e3e6;
  --sombra-card: 0 1px 2px rgba(0, 0, 0, 0.06), 0 1px 1px rgba(0, 0, 0, 0.04);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cor-fundo);
  color: var(--cor-texto);
}

button {
  font-family: inherit;
}

/* ---------- Layout / cabeçalho ---------- */

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 24px;
  background: #fff;
  border-bottom: 1px solid var(--cor-borda);
  position: sticky;
  top: 0;
  z-index: 20;
}

.app-header__brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  white-space: nowrap;
}

.app-header__logo {
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
}

.app-header__badge {
  font-size: 11px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 999px;
  padding: 2px 8px;
}

.app-nav {
  display: flex;
  gap: 4px;
  flex: 1;
  justify-content: center;
}

.app-nav button {
  text-decoration: none;
  color: var(--cor-texto-suave);
  font-size: 14px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 8px;
  background: none;
  border: none;
  cursor: pointer;
}

.app-nav button.ativo {
  color: var(--cor-primaria);
  background: rgba(214, 40, 40, 0.08);
}

.app-header__usuario {
  display: flex;
  align-items: center;
  gap: 12px;
}

.app-header__avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--cor-primaria);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
}

.app-header__menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  width: 34px;
  height: 34px;
  font-size: 16px;
  cursor: pointer;
}

.app-content {
  flex: 1;
  min-width: 0;
}

/* ---------- Dashboard ---------- */

.dashboard {
  padding: 24px;
  max-width: 960px;
  margin: 0 auto;
}

.dashboard h1 {
  margin: 0 0 4px;
  font-size: 24px;
}

.dashboard__subtitulo {
  margin: 0 0 24px;
  color: var(--cor-texto-suave);
}

.dashboard__cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.dashboard__card {
  background: #fff;
  border: 1px solid var(--cor-borda);
  border-radius: 12px;
  padding: 16px;
  box-shadow: var(--sombra-card);
}

.dashboard__card-label {
  display: block;
  font-size: 12px;
  color: var(--cor-texto-suave);
  margin-bottom: 6px;
}

.dashboard__card-valor {
  font-size: 26px;
  font-weight: 700;
}

.dashboard__card-valor small {
  font-size: 14px;
  font-weight: 500;
  color: var(--cor-texto-suave);
}

.dashboard__barra {
  margin-top: 10px;
  height: 6px;
  border-radius: 999px;
  background: var(--cor-fundo);
  overflow: hidden;
}

.dashboard__barra-preenchida {
  height: 100%;
  background: var(--cor-primaria);
}

.dashboard__cta {
  display: inline-block;
  background: var(--cor-primaria);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.dashboard__cta:hover {
  background: var(--cor-primaria-escura);
}

/* ---------- Pipeline ---------- */

.pipeline-loading {
  padding: 24px;
  color: var(--cor-texto-suave);
}

.pipeline__board {
  display: flex;
  gap: 14px;
  padding: 16px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
}

.pipeline__coluna {
  flex: 0 0 260px;
  scroll-snap-align: start;
  background: #eef0f2;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 120px);
}

.pipeline__coluna--ganho {
  background: #e7f5ea;
}

.pipeline__coluna--perdido {
  background: #f5e9e9;
}

.pipeline__coluna-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px 6px;
}

.pipeline__coluna-header h2 {
  font-size: 13px;
  font-weight: 700;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--cor-texto-suave);
}

.pipeline__contagem {
  font-size: 12px;
  font-weight: 700;
  background: #fff;
  border-radius: 999px;
  padding: 1px 8px;
  color: var(--cor-texto-suave);
}

.pipeline__coluna-cards {
  padding: 4px 10px 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pipeline__vazio {
  font-size: 12px;
  color: var(--cor-texto-suave);
  padding: 8px 4px;
}

.op-card {
  background: #fff;
  border: 1px solid var(--cor-borda);
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  box-shadow: var(--sombra-card);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.op-card:hover {
  border-color: var(--cor-primaria);
}

.op-card__veiculo {
  font-size: 13.5px;
}

.op-card__cliente {
  margin: 0;
  font-size: 12.5px;
  color: var(--cor-texto);
}

.op-card__proxima {
  margin: 0;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.op-card__valor {
  margin-top: 4px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--cor-primaria-escura);
}

/* ---------- Painel lateral ---------- */

.side-panel__overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  justify-content: flex-end;
  z-index: 30;
}

.side-panel {
  width: min(420px, 100%);
  height: 100%;
  background: #fff;
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 16px rgba(0, 0, 0, 0.12);
  animation: side-panel-in 0.18s ease-out;
}

@keyframes side-panel-in {
  from {
    transform: translateX(24px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

.side-panel__header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--cor-borda);
}

.side-panel__header h2 {
  margin: 0 0 4px;
  font-size: 17px;
}

.side-panel__cliente {
  margin: 0;
  color: var(--cor-texto-suave);
  font-size: 13px;
}

.side-panel__fechar {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  color: var(--cor-texto-suave);
}

.side-panel__tabs {
  display: flex;
  gap: 4px;
  padding: 10px 16px 0;
  border-bottom: 1px solid var(--cor-borda);
}

.side-panel__tabs button {
  background: none;
  border: none;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--cor-texto-suave);
  cursor: pointer;
  border-bottom: 2px solid transparent;
}

.side-panel__tabs button.ativo {
  color: var(--cor-primaria);
  border-bottom-color: var(--cor-primaria);
}

.side-panel__body {
  padding: 18px 20px;
  overflow-y: auto;
}

.side-panel__lista {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 16px;
  margin: 0;
}

.side-panel__lista dt {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.side-panel__lista dd {
  margin: 0;
  font-size: 13.5px;
  text-align: right;
}

.side-panel__timeline {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.side-panel__timeline li {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-left: 14px;
  border-left: 2px solid var(--cor-borda);
}

.side-panel__timeline-data {
  font-size: 11px;
  color: var(--cor-texto-suave);
  text-transform: uppercase;
}

.side-panel__checklist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.side-panel__checklist label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
}

.side-panel__vazio-aba {
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

/* ---------- Painel lateral: seções de ação (mover etapa / próxima ação) --- */

.side-panel__secao {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--cor-borda);
}

.side-panel__secao-titulo {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--cor-texto-suave);
}

.side-panel__aviso {
  margin: 0 0 10px;
  font-size: 12px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  padding: 8px 10px;
}

.side-panel__form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.side-panel__form select,
.side-panel__form input[type="text"],
.side-panel__form input[type="date"],
.side-panel__form textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13.5px;
  font-family: inherit;
  background: #fff;
  color: var(--cor-texto);
}

.side-panel__form textarea {
  resize: vertical;
  min-height: 72px;
  line-height: 1.4;
}

.side-panel__anotacoes-status {
  align-self: center;
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

.side-panel__campo {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.side-panel__form-acoes {
  display: flex;
  gap: 8px;
}

.side-panel__botao-primario {
  background: var(--cor-primaria);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.side-panel__botao-primario:hover {
  background: var(--cor-primaria-escura);
}

.side-panel__botao-primario:disabled {
  background: var(--cor-borda);
  color: var(--cor-texto-suave);
  cursor: not-allowed;
}

.side-panel__botao-secundario {
  background: none;
  color: var(--cor-texto);
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.side-panel__botao-secundario:hover {
  border-color: var(--cor-primaria);
  color: var(--cor-primaria);
}

/* ---------- Responsivo ---------- */

@media (max-width: 720px) {
  .app-header {
    padding: 10px 16px;
    flex-wrap: wrap;
  }

  .app-header__menu-btn {
    display: block;
  }

  .app-nav {
    order: 3;
    flex-basis: 100%;
    justify-content: flex-start;
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-top: 8px;
    border-top: 1px solid var(--cor-borda);
    margin-top: 8px;
  }

  .app-nav--aberto {
    display: flex;
  }

  .app-nav button {
    padding: 10px 8px;
    text-align: left;
  }

  .dashboard {
    padding: 16px;
  }

  .pipeline__board {
    scroll-snap-type: x mandatory;
  }

  .pipeline__coluna {
    flex-basis: 84vw;
    max-height: calc(100vh - 150px);
  }

  .side-panel {
    width: 100%;
  }
}

</style>

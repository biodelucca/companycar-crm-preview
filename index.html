<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#111111" />
<title>Companycar CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d62828'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
<style>
:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --cor-primaria: #d62828;
  --cor-primaria-escura: #a81f1f;
  --cor-fundo: #f5f5f7;
  --cor-texto: #111114;
  --cor-texto-suave: #6b6b70;
  --cor-borda: #e3e3e6;
  --sombra-card: 0 1px 2px rgba(0, 0, 0, 0.06), 0 1px 1px rgba(0, 0, 0, 0.04);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cor-fundo);
  color: var(--cor-texto);
}

button {
  font-family: inherit;
}

/* ---------- Layout / cabeçalho ---------- */

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 24px;
  background: #fff;
  border-bottom: 1px solid var(--cor-borda);
  position: sticky;
  top: 0;
  z-index: 20;
}

.app-header__brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  white-space: nowrap;
}

.app-header__logo {
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
}

.app-header__badge {
  font-size: 11px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 999px;
  padding: 2px 8px;
}

.app-nav {
  display: flex;
  gap: 4px;
  flex: 1;
  justify-content: center;
}

.app-nav button {
  text-decoration: none;
  color: var(--cor-texto-suave);
  font-size: 14px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 8px;
  background: none;
  border: none;
  cursor: pointer;
}

.app-nav button.ativo {
  color: var(--cor-primaria);
  background: rgba(214, 40, 40, 0.08);
}

.app-header__usuario {
  display: flex;
  align-items: center;
  gap: 12px;
}

.app-header__avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--cor-primaria);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
}

.app-header__logout {
  background: none;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  color: inherit;
}

.app-header__logout:hover {
  border-color: var(--cor-primaria);
  color: var(--cor-primaria);
}

.app-header__menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  width: 34px;
  height: 34px;
  font-size: 16px;
  cursor: pointer;
}

.app-content {
  flex: 1;
  min-width: 0;
}

/* ---------- Dashboard ---------- */

.dashboard {
  padding: 24px;
  max-width: 960px;
  margin: 0 auto;
}

.dashboard h1 {
  margin: 0 0 4px;
  font-size: 24px;
}

/* Ciclo pós-produção (2026-08-13) — item 6: cabeçalho do Dashboard agora
   divide espaço com o atalho "+ Nova Negociação" (mesmo botão do Pipeline,
   ver .pipeline__botao-nova). */
.dashboard__cabecalho {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.dashboard__cabecalho h1 {
  margin: 0;
}

.dashboard__subtitulo {
  margin: 0 0 24px;
  color: var(--cor-texto-suave);
}

.dashboard__cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.dashboard__card {
  background: #fff;
  border: 1px solid var(--cor-borda);
  border-radius: 12px;
  padding: 16px;
  box-shadow: var(--sombra-card);
}

.dashboard__card-label {
  display: block;
  font-size: 12px;
  color: var(--cor-texto-suave);
  margin-bottom: 6px;
}

.dashboard__card-valor {
  font-size: 26px;
  font-weight: 700;
}

.dashboard__card-sub {
  display: block;
  margin-top: 4px;
  font-size: 11.5px;
  color: var(--cor-texto-suave);
}

.dashboard__cards--analiticos {
  margin-bottom: 16px;
}

/* Melhoria 6 "Filtro de período no Dashboard" (2026-10-07) — linha discreta
   com o período analisado, o erro do período personalizado e o aviso de
   histórico de vendas. */
.dashboard__periodo-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: -12px 0 16px;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.dashboard__aviso {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.dashboard__aviso--erro {
  color: var(--cor-primaria-escura);
  font-weight: 600;
}

.dashboard__filtros input[type="date"] {
  padding: 7px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13.5px;
  font-family: inherit;
  background: #fff;
  color: var(--cor-texto);
}

.dashboard__filtros input[aria-invalid="true"] {
  border-color: var(--cor-primaria);
}

.dashboard__card-valor small {
  font-size: 14px;
  font-weight: 500;
  color: var(--cor-texto-suave);
}

.dashboard__barra {
  margin-top: 10px;
  height: 6px;
  border-radius: 999px;
  background: var(--cor-fundo);
  overflow: hidden;
}

.dashboard__barra-preenchida {
  height: 100%;
  background: var(--cor-primaria);
}

.dashboard__cta {
  display: inline-block;
  background: var(--cor-primaria);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.dashboard__cta:hover {
  background: var(--cor-primaria-escura);
}

/* ---------- Dashboard: filtros (Sprint 2) ---------- */
/* Estrutura mínima pedida pelo CEO — período/responsável/origem, sem UI
   avançada (datepicker custom etc). Mesmo visual de campo já usado em
   .side-panel__form, repetido aqui para não acoplar o Dashboard ao
   SidePanel só por causa de CSS. */

.dashboard__filtros {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
}

.dashboard__filtros label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.dashboard__filtros select {
  padding: 8px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13.5px;
  font-family: inherit;
  background: #fff;
  color: var(--cor-texto);
  min-width: 180px;
}

/* ---------- Dashboard: indicadores (Sprint 2) ---------- */

.dashboard__secao {
  background: #fff;
  border: 1px solid var(--cor-borda);
  border-radius: 12px;
  padding: 16px;
  box-shadow: var(--sombra-card);
  margin-bottom: 20px;
}

.dashboard__secao-titulo {
  margin: 0 0 12px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--cor-texto-suave);
}

.dashboard__grade-indicadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.dashboard__grade-indicadores .dashboard__secao {
  margin-bottom: 0;
}

.dashboard__vazio {
  margin: 0;
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

.dashboard__lista-contagem {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dashboard__lista-contagem li {
  display: grid;
  grid-template-columns: minmax(80px, 1fr) minmax(60px, 2fr) auto;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}

.dashboard__lista-contagem-rotulo {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dashboard__lista-contagem-barra {
  display: block;
  height: 6px;
  border-radius: 999px;
  background: var(--cor-fundo);
  overflow: hidden;
}

.dashboard__lista-contagem-barra-preenchida {
  display: block;
  height: 100%;
  background: var(--cor-primaria);
}

.dashboard__lista-contagem-valor {
  font-weight: 700;
  text-align: right;
  min-width: 20px;
}

.dashboard__lista-acoes {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.dashboard__lista-acoes li {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--cor-borda);
}

.dashboard__lista-acoes li:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.dashboard__lista-acoes-principal {
  font-size: 13.5px;
  font-weight: 600;
}

.dashboard__lista-acoes-detalhe {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

/* Ciclo "Refinamentos Operacionais" (2026-08-18) — item 6: itens de
   Próxima Ação no Dashboard passam a abrir a oportunidade no Pipeline. */
.dashboard__lista-acoes-item--clicavel {
  cursor: pointer;
  border-radius: 6px;
  margin: 0 -6px;
  padding-left: 6px;
  padding-right: 6px;
}

.dashboard__lista-acoes-item--clicavel:hover {
  background: var(--cor-fundo);
}

/* Melhoria 5 "Agenda de Próximas Ações no Dashboard" (2026-10-07) — reaproveita
   .dashboard__secao e .dashboard__lista-acoes; só acrescenta o que é novo:
   cabeçalho com filtro, grupos (Atrasadas/Hoje/Próximos dias), coluna de
   horário e o destaque discreto das atrasadas. */
.agenda__cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.agenda__titulo {
  margin: 0;
}

.agenda__filtro {
  padding: 6px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  background: #fff;
  color: var(--cor-texto);
  font-size: 13px;
  max-width: 100%;
}

.agenda__grupo {
  margin-bottom: 16px;
}

.agenda__grupo:last-child {
  margin-bottom: 0;
}

.agenda__grupo-titulo {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--cor-texto);
}

.agenda__grupo-contagem {
  font-size: 11px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--cor-fundo);
  color: var(--cor-texto-suave);
}

.agenda__grupo--atrasadas .agenda__grupo-titulo {
  color: var(--cor-primaria-escura);
}

.agenda__grupo--atrasadas .agenda__grupo-contagem {
  background: #fdecec;
  color: var(--cor-primaria-escura);
}

.agenda__grupo--atrasadas .agenda__lista li.agenda__item {
  border-left-color: var(--cor-primaria);
}

.agenda__grupo--atrasadas .agenda__quando {
  color: var(--cor-primaria-escura);
}

.agenda__vazio {
  margin: 0;
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

.agenda__lista li.agenda__item {
  flex-direction: row;
  align-items: flex-start;
  gap: 12px;
  border-left: 3px solid transparent;
  padding-left: 10px;
}

.agenda__quando {
  flex: 0 0 76px;
  font-size: 12.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--cor-texto);
}

.agenda__corpo {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.agenda__ver-mais {
  margin-top: 8px;
  padding: 4px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  background: #fff;
  color: var(--cor-texto-suave);
  font-size: 12px;
  cursor: pointer;
}

.agenda__ver-mais:hover {
  background: var(--cor-fundo);
}

/* ---------- Pipeline ---------- */

.pipeline-loading {
  padding: 24px;
  color: var(--cor-texto-suave);
}

/* Sprint 3.5 "Nova Negociação" — barra no topo do Pipeline com o botão
   "+ Nova Negociação" (critério de aceite: botão sempre visível ali). */
.pipeline__topo {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 16px 0;
}

/* Ciclo pós-produção (2026-08-13) — itens 1, 3, 4 e 5: barra do topo do
   Pipeline dividida em duas metades (filtro/busca à esquerda, atualizar/
   nova negociação à direita), reaproveitando os mesmos campos de
   .dashboard__filtros / .side-panel__form por consistência visual. */
.pipeline__topo-esquerda,
.pipeline__topo-direita {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.pipeline__filtro-responsavel {
  padding: 8px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13.5px;
  background: #fff;
}

.pipeline__busca {
  padding: 8px 12px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13.5px;
  min-width: 220px;
}

/* Ciclo "Refinamentos Operacionais" (2026-08-18) — item 1: mesmo visual
   do filtro de responsável, reaproveitado para o toggle de ordenação. */
.pipeline__ordenacao {
  padding: 8px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13.5px;
  background: #fff;
}

.pipeline__botao-atualizar {
  background: none;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13.5px;
  cursor: pointer;
  color: inherit;
}

.pipeline__botao-atualizar:hover:not(:disabled) {
  border-color: var(--cor-primaria);
  color: var(--cor-primaria);
}

.pipeline__botao-atualizar:disabled {
  opacity: 0.6;
  cursor: default;
}

.pipeline__ultima-atualizacao {
  font-size: 12px;
  color: var(--cor-texto-suave);
  white-space: nowrap;
}

@media (max-width: 720px) {
  .pipeline__topo-esquerda,
  .pipeline__topo-direita {
    width: 100%;
  }

  .pipeline__busca {
    flex: 1 1 auto;
    min-width: 0;
  }
}

.pipeline__botao-nova {
  background: var(--cor-primaria);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 16px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.pipeline__botao-nova:hover {
  background: var(--cor-primaria-escura);
}

.pipeline__board {
  display: flex;
  gap: 14px;
  padding: 16px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
}

.pipeline__coluna {
  flex: 0 0 260px;
  scroll-snap-align: start;
  background: #eef0f2;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 120px);
}

.pipeline__coluna--ganho {
  background: #e7f5ea;
}

.pipeline__coluna--perdido {
  background: #f5e9e9;
}

/* Sprint 1 — drag-and-drop (desktop): destaque da coluna sob o card
   arrastado, ver handleDragOverColuna/handleDropColuna em Pipeline.tsx. */
.pipeline__coluna--sobre {
  outline: 2px dashed var(--cor-primaria);
  outline-offset: -4px;
  background: #fdeded;
}

.pipeline__aviso-acao {
  margin: 12px 16px 0;
  padding: 8px 14px;
  background: #fdeded;
  border: 1px solid #f3caca;
  border-radius: 8px;
  color: var(--cor-primaria-escura);
  font-size: 13px;
}

.pipeline__coluna-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px 6px;
}

.pipeline__coluna-header h2 {
  font-size: 13px;
  font-weight: 700;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--cor-texto-suave);
}

.pipeline__contagem {
  font-size: 12px;
  font-weight: 700;
  background: #fff;
  border-radius: 999px;
  padding: 1px 8px;
  color: var(--cor-texto-suave);
}

.pipeline__coluna-cards {
  padding: 4px 10px 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pipeline__vazio {
  font-size: 12px;
  color: var(--cor-texto-suave);
  padding: 8px 4px;
}

.op-card {
  background: #fff;
  border: 1px solid var(--cor-borda);
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  box-shadow: var(--sombra-card);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.op-card:hover {
  border-color: var(--cor-primaria);
}

/* Sprint 1 — drag-and-drop (desktop only, ver arrastavel em
   OpportunityCard.tsx/Pipeline.tsx). */
.op-card--arrastavel {
  cursor: grab;
}

.op-card--arrastavel:active {
  cursor: grabbing;
}

/* Sprint 3.5 "Nova Negociação" — destaque temporário do card recém-criado
   (ver destaqueId em Pipeline.tsx, que liga isto por 4s e depois limpa
   sozinho). Anima só o outline/sombra, não o layout — não empurra os
   cards vizinhos. */
.op-card--destaque {
  outline: 2px solid var(--cor-primaria);
  outline-offset: 1px;
  animation: op-card-destaque 1.6s ease-in-out 2;
}

@keyframes op-card-destaque {
  0%,
  100% {
    box-shadow: var(--sombra-card);
  }
  50% {
    box-shadow: 0 0 0 4px rgba(214, 40, 40, 0.18);
  }
}

.op-card__veiculo {
  font-size: 13.5px;
}

.op-card__cliente {
  margin: 0;
  font-size: 12.5px;
  color: var(--cor-texto);
}

.op-card__proxima {
  margin: 0;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.op-card__valor {
  margin-top: 4px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--cor-primaria-escura);
}

/* ---------- Painel lateral ---------- */

.side-panel__overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  justify-content: flex-end;
  z-index: 30;
}

.side-panel {
  width: min(420px, 100%);
  height: 100%;
  background: #fff;
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 16px rgba(0, 0, 0, 0.12);
  animation: side-panel-in 0.18s ease-out;
}

@keyframes side-panel-in {
  from {
    transform: translateX(24px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

.side-panel__header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--cor-borda);
}

.side-panel__header h2 {
  margin: 0 0 4px;
  font-size: 17px;
}

.side-panel__cliente {
  margin: 0;
  color: var(--cor-texto-suave);
  font-size: 13px;
}

.side-panel__fechar {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  color: var(--cor-texto-suave);
}

.side-panel__tabs {
  display: flex;
  gap: 4px;
  padding: 10px 16px 0;
  border-bottom: 1px solid var(--cor-borda);
}

.side-panel__tabs button {
  background: none;
  border: none;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--cor-texto-suave);
  cursor: pointer;
  border-bottom: 2px solid transparent;
}

.side-panel__tabs button.ativo {
  color: var(--cor-primaria);
  border-bottom-color: var(--cor-primaria);
}

.side-panel__body {
  padding: 18px 20px;
  overflow-y: auto;
}

.side-panel__lista {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 16px;
  margin: 0;
}

.side-panel__lista dt {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.side-panel__lista dd {
  margin: 0;
  font-size: 13.5px;
  text-align: right;
}

.side-panel__timeline {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.side-panel__timeline li {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-left: 14px;
  border-left: 2px solid var(--cor-borda);
}

.side-panel__timeline-data {
  font-size: 11px;
  color: var(--cor-texto-suave);
  text-transform: uppercase;
}

.side-panel__checklist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.side-panel__checklist label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
}

/* Ciclo 22 "Funil Comercial — Bloco 1" (2026-08-12) — data/hora de quando o
   item foi marcado, mesmo estilo discreto já usado em .side-panel__timeline-data. */
.side-panel__checklist-data {
  font-size: 11px;
  color: var(--cor-texto-suave);
  margin-left: 24px;
}

.side-panel__vazio-aba {
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

/* ---------- Painel lateral: seções de ação (mover etapa / próxima ação) --- */

.side-panel__secao {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--cor-borda);
}

.side-panel__secao-titulo {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--cor-texto-suave);
}

.side-panel__aviso {
  margin: 0 0 10px;
  font-size: 12px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  padding: 8px 10px;
}

/* Ciclo pós-produção (2026-08-13) — item 7: mostra a próxima ação atual
   direto na visão normal da oportunidade (antes só aparecia entrando no
   modo de edição). Bloco compacto, sem alterar os botões existentes
   "Editar/Definir próxima ação" logo abaixo. */
.side-panel__proxima-acao-atual {
  margin: 0 0 12px;
  padding: 10px 12px;
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
}

.side-panel__proxima-acao-descricao {
  margin: 0 0 2px;
  font-size: 14px;
  font-weight: 600;
}

.side-panel__proxima-acao-meta {
  margin: 0;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.side-panel__form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.side-panel__form select,
.side-panel__form input[type="text"],
.side-panel__form input[type="date"],
.side-panel__form textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13.5px;
  font-family: inherit;
  background: #fff;
  color: var(--cor-texto);
}

.side-panel__form textarea {
  resize: vertical;
  min-height: 72px;
  line-height: 1.4;
}

.side-panel__anotacoes-status {
  align-self: center;
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

.side-panel__campo {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.side-panel__form-acoes {
  display: flex;
  gap: 8px;
}

.side-panel__botao-primario {
  background: var(--cor-primaria);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.side-panel__botao-primario:hover {
  background: var(--cor-primaria-escura);
}

.side-panel__botao-primario:disabled {
  background: var(--cor-borda);
  color: var(--cor-texto-suave);
  cursor: not-allowed;
}

.side-panel__botao-secundario {
  background: none;
  color: var(--cor-texto);
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.side-panel__botao-secundario:hover {
  border-color: var(--cor-primaria);
  color: var(--cor-primaria);
}

/* Sprint 6 "Operação do dia a dia" (2026-08-07) — item 1 "Excluir
   negociação": botão de ação destrutiva. Como --cor-primaria já é
   vermelha (identidade da marca), usa um vermelho mais escuro e sólido
   para não se confundir com os botões primários normais do painel. */
.side-panel__botao-perigo {
  background: #fff;
  color: #b91c1c;
  border: 1px solid #b91c1c;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.side-panel__botao-perigo:hover {
  background: #b91c1c;
  color: #fff;
}

.side-panel__botao-perigo:disabled {
  background: var(--cor-borda);
  color: var(--cor-texto-suave);
  border-color: var(--cor-borda);
  cursor: not-allowed;
}

/* ---------- Sprint 3: veículo do estoque (busca / associação) ---------- */

.side-panel__veiculo-estoque {
  margin-bottom: 12px;
}

.side-panel__veiculo-estoque-imagem {
  width: 100%;
  max-height: 140px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 10px;
  border: 1px solid var(--cor-borda);
}

.side-panel__estoque-resultados {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 320px;
  overflow-y: auto;
}

.side-panel__estoque-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
}

.side-panel__estoque-item img {
  width: 56px;
  height: 42px;
  object-fit: cover;
  border-radius: 6px;
  flex-shrink: 0;
}

/* Fix 2026-11-16: quadro neutro quando a foto do estoque nao carrega (ver components/ImagemEstoque.js) */
.estoque-sem-foto {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 42px;
  flex-shrink: 0;
  border-radius: 6px;
  background: #f1f1f1;
  border: 1px dashed var(--cor-borda);
  color: #888;
  font-size: 10px;
  text-align: center;
}

.estoque-sem-foto.side-panel__veiculo-estoque-imagem {
  width: 100%;
  height: 90px;
  max-height: none;
  margin-bottom: 10px;
  font-size: 12px;
}

.side-panel__estoque-item-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}

.side-panel__estoque-item-info strong {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.side-panel__estoque-item-info span {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.side-panel__estoque-item .side-panel__botao-primario {
  padding: 7px 10px;
  font-size: 12.5px;
  flex-shrink: 0;
}

/* ---------- Modal de motivo de perda (drag-and-drop -> Perdido) ---------- */
/* Sprint 1 — mesmo padrão visual do side-panel__overlay, mas centralizado
   em vez de ancorado à direita (ver dropPendente em Pipeline.tsx). */

.drop-motivo-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 40;
}

.drop-motivo-modal {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  width: min(360px, 90vw);
  box-shadow: var(--sombra-card);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.drop-motivo-modal h3 {
  margin: 0;
  font-size: 15px;
}

/* ---------- Modal de Nova Negociação (Sprint 3.5, 2026-08-03) ---------- */
/* Mesmo padrão de overlay/modal centralizado acima (drop-motivo-*), classes
   próprias porque o formulário tem 9 campos em vez de 2 — precisa de altura
   máxima com scroll interno para caber em telas menores. */

.nova-negociacao-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 40;
  padding: 16px;
}

.nova-negociacao-modal {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  width: min(420px, 100%);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  box-shadow: var(--sombra-card);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.nova-negociacao-modal h3 {
  margin: 0;
  font-size: 15px;
}

/* ---------- Conversas (WhatsApp, Sprint 5, 2026-08-04) ---------- */
/* Reformulado na "Fase de Refinamento — UX do módulo de Conversas"
   (2026-08-04): objetivo do CEO é uma experiência capaz de substituir o
   Digisac no dia a dia da equipe. Ver comentário no topo de
   src/pages/Conversas.tsx para a lista completa do que mudou e por quê. */

.conversas {
  display: flex;
  height: calc(100vh - 61px); /* 61px = altura aproximada do .app-header */
  min-height: 480px;
}

.conversas__lista {
  width: 320px;
  flex-shrink: 0;
  border-right: 1px solid var(--cor-borda);
  background: #fff;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.conversas__lista-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px;
  border-bottom: 1px solid var(--cor-borda);
}

.conversas__lista-header h2 {
  margin: 0;
  font-size: 16px;
  flex: 1;
}

.conversas__contagem {
  font-size: 11px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 999px;
  padding: 2px 8px;
}

.conversas__badge-naolidas {
  font-size: 10.5px;
  font-weight: 600;
  color: #fff;
  background: var(--cor-primaria-escura, #d62828);
  border-radius: 999px;
  padding: 2px 9px;
  white-space: nowrap;
}

.conversas__busca {
  padding: 10px 16px;
  border-bottom: 1px solid var(--cor-borda);
}

.conversas__busca input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  box-sizing: border-box;
}

.conversas__vazio {
  padding: 16px;
  color: var(--cor-texto-suave);
  font-size: 13px;
}

.conversas__itens {
  list-style: none;
  margin: 0;
  padding: 0;
}

.conversas__item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid var(--cor-borda);
  padding: 12px 16px;
  cursor: pointer;
}

.conversas__item:hover {
  background: var(--cor-fundo);
}

.conversas__item--ativo {
  background: rgba(214, 40, 40, 0.06);
}

.conversas__item--naolida .conversas__item-topo strong,
.conversas__item--naolida .conversas__item-preview {
  color: var(--cor-texto, #1a1a1a);
  font-weight: 600;
}

.conversas__item-avatar {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--cor-texto-suave);
}

.conversas__item-corpo {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.conversas__item-topo {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.conversas__item-topo strong {
  font-size: 13.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.conversas__item-hora {
  font-size: 11px;
  color: var(--cor-texto-suave);
  flex-shrink: 0;
}

.conversas__item-preview {
  margin: 4px 0 6px;
  font-size: 12.5px;
  color: var(--cor-texto-suave);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.conversas__item-rodape {
  display: flex;
  align-items: center;
  gap: 6px;
}

.conversas__badge {
  font-size: 10.5px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 999px;
  padding: 2px 8px;
}

.conversas__badge--pendente {
  color: var(--cor-primaria-escura);
  background: rgba(214, 40, 40, 0.08);
  border-color: rgba(214, 40, 40, 0.25);
}

.conversas__ponto-naolida {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cor-primaria-escura, #d62828);
  flex-shrink: 0;
}

.conversas__thread {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.conversas__thread-vazio {
  margin: auto;
  color: var(--cor-texto-suave);
  font-size: 13.5px;
  padding: 16px;
  text-align: center;
}

.conversas__thread-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--cor-borda);
  background: #fff;
}

.conversas__thread-header-info {
  flex: 1;
  min-width: 0;
}

.conversas__thread-header-acoes {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.conversas__thread-header h3 {
  margin: 0;
  font-size: 15px;
}

.conversas__thread-telefone {
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.conversas__voltar {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--cor-primaria-escura, #d62828);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 4px 4px 0;
}

.conversas__acoes-toggle {
  font-size: 11.5px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 999px;
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
}

.conversas__acoes-toggle:hover {
  background: #fff;
}

.conversas__painel-acoes {
  padding: 12px 20px;
  border-bottom: 1px solid var(--cor-borda);
  background: var(--cor-fundo);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.conversas__acoes-aviso {
  margin: 0;
  font-size: 12.5px;
  color: var(--cor-texto-suave);
}

.conversas__acoes-sucesso {
  margin: 0;
  font-size: 12.5px;
  color: #2a7a3d;
}

.conversas__acao-bloco {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.conversas__acao-bloco > label {
  font-size: 11px;
  font-weight: 600;
  color: var(--cor-texto-suave);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.conversas__acao-linha {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.conversas__acao-linha select,
.conversas__acao-bloco input[type="text"] {
  padding: 7px 9px;
  border: 1px solid var(--cor-borda);
  border-radius: 6px;
  font-family: inherit;
  font-size: 12.5px;
}

.conversas__acao-bloco input[type="text"] {
  width: 100%;
  box-sizing: border-box;
}

.conversas__timeline {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 160px;
  overflow-y: auto;
  font-size: 12px;
  color: var(--cor-texto-suave);
}

.conversas__timeline-hora {
  color: var(--cor-texto-suave);
  font-weight: 600;
}

.conversas__vincular {
  padding: 14px 20px;
  border-bottom: 1px solid var(--cor-borda);
  background: var(--cor-fundo);
}

.conversas__mensagens {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.conversas__grupo-dia {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.conversas__separador-dia {
  display: flex;
  justify-content: center;
  margin: 10px 0 6px;
}

.conversas__separador-dia span {
  font-size: 11px;
  color: var(--cor-texto-suave);
  background: var(--cor-fundo);
  border: 1px solid var(--cor-borda);
  border-radius: 999px;
  padding: 3px 12px;
}

.conversas__balao {
  max-width: min(560px, 78%);
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 13.5px;
  line-height: 1.42;
  white-space: pre-wrap;
  margin-bottom: 4px;
}

.conversas__balao-autor {
  display: block;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--cor-primaria-escura, #d62828);
  margin-bottom: 2px;
}

.conversas__balao p {
  margin: 0;
}

.conversas__balao-hora {
  display: block;
  margin-top: 4px;
  font-size: 10.5px;
  color: var(--cor-texto-suave);
  text-align: right;
}

.conversas__balao--recebida {
  align-self: flex-start;
  background: #fff;
  border: 1px solid var(--cor-borda);
}

.conversas__balao--enviada {
  align-self: flex-end;
  background: rgba(37, 130, 62, 0.1);
  border: 1px solid rgba(37, 130, 62, 0.25);
}

.conversas__caixa-envio {
  padding: 10px 20px 14px;
  border-top: 1px solid var(--cor-borda);
  background: #fff;
}

.conversas__enviando-como {
  margin: 0 0 6px;
  font-size: 11px;
  color: var(--cor-texto-suave);
}

.conversas__caixa-envio-linha {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.conversas__caixa-envio-linha textarea {
  flex: 1;
  resize: none;
  min-height: 40px;
  max-height: 120px;
  padding: 9px 10px;
  border: 1px solid var(--cor-borda);
  border-radius: 8px;
  font-family: inherit;
  font-size: 13.5px;
}

/* ---------- Responsivo ---------- */

@media (max-width: 720px) {
  .app-header {
    padding: 10px 16px;
    flex-wrap: wrap;
  }

  .app-header__menu-btn {
    display: block;
  }

  .app-nav {
    order: 3;
    flex-basis: 100%;
    justify-content: flex-start;
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-top: 8px;
    border-top: 1px solid var(--cor-borda);
    margin-top: 8px;
  }

  .app-nav--aberto {
    display: flex;
  }

  .app-nav button {
    padding: 10px 8px;
    text-align: left;
  }

  .dashboard {
    padding: 16px;
  }

  .dashboard__filtros {
    flex-direction: column;
  }

  .dashboard__filtros select {
    width: 100%;
    min-width: 0;
  }

  .dashboard__lista-contagem li {
    grid-template-columns: minmax(70px, 1fr) minmax(40px, 1.4fr) auto;
    font-size: 12.5px;
  }

  .pipeline__board {
    scroll-snap-type: x mandatory;
  }

  .pipeline__coluna {
    flex-basis: 84vw;
    max-height: calc(100vh - 150px);
  }

  .side-panel {
    width: 100%;
  }

  /* Painel único no celular (2026-08-04): antes lista e conversa ficavam
     espremidas uma em cima da outra (lista fixa em 40vh) — o espaço real
     pra ler mensagens era pequeno demais pra uso diário. Agora
     Conversas.tsx só renderiza um painel por vez (lista OU conversa, com
     botão "← Conversas" pra voltar), então cada um pode ocupar a tela
     inteira. */
  .conversas {
    height: calc(100vh - 61px);
  }

  .conversas__lista {
    width: 100%;
  }

  .conversas__balao {
    max-width: 90%;
  }

  .conversas__thread-header {
    flex-wrap: wrap;
  }

  .conversas__thread-header-acoes {
    width: 100%;
    order: 3;
  }
}

/* ---------- Melhoria 7 "Relatórios" (2026-10-07) ---------- */

.relatorios {
  padding: 24px;
  max-width: 1280px;
  margin: 0 auto;
}

.relatorios__cabecalho {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;

/* ---------- Melhoria 10 / Central de Recuperação — Etapa C1 (somente leitura) ---------- */
.recup__lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.recup__demanda {
  background: #fff;
  border: 1px solid var(--cor-borda);
  border-left: 4px solid var(--cor-borda);
  border-radius: 12px;
  box-shadow: var(--sombra-card);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.recup__demanda[data-sem-acompanhamento="sim"] { border-left-color: var(--cor-primaria); }
.recup__demanda[data-sem-acompanhamento="nao"][data-novas]:not([data-novas="0"]) { border-left-color: #1f4fa8; }
.recup__topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.recup__titulo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; min-width: 0; }
.recup__abrir { font-size: 15px; font-weight: 600; text-align: left; }
.recup__codigo { color: var(--cor-texto-suave); font-size: 12.5px; }
.recup__selos { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.recup__selo {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.recup__selo--sem-acomp { background: #fdeaea; color: var(--cor-primaria-escura); }
.recup__selo--nova { background: #e7effd; color: #1f4fa8; margin-left: 6px; }
.recup__selos .recup__selo--nova { margin-left: 0; }
.recup__selo--disp { background: #e6f4ea; color: #1b6b36; }
.recup__selo--indisp { background: #ececef; color: #55555b; }
.recup__procura, .recup__meta { margin: 0; font-size: 13.5px; }
.recup__meta { color: var(--cor-texto-suave); }
.recup__procura small { color: var(--cor-texto-suave); font-size: 12.5px; }
.recup__veiculos { list-style: none; margin: 0; padding: 0; border: 1px solid var(--cor-borda); border-radius: 8px; overflow: hidden; }
.recup__veiculo {
  display: grid;
  grid-template-columns: minmax(180px, 2.2fr) 0.9fr 0.9fr 0.9fr 1fr 1.2fr 0.9fr;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  font-size: 13px;
}
.recup__veiculo + .recup__veiculo { border-top: 1px solid var(--cor-borda); }
.recup__veiculo--indisponivel { background: var(--cor-fundo); color: var(--cor-texto-suave); }
.recup__veiculo-nome { font-weight: 600; overflow-wrap: anywhere; }
.recup__preco { font-weight: 600; }
.recup__rodape { display: flex; justify-content: flex-end; }
.recup__vazio { padding: 24px 12px; text-align: center; }
.recup__painel-corpo { display: flex; flex-direction: column; gap: 16px; }
.recup__secao h3 { margin: 0 0 6px; font-size: 14px; }
.recup__secao p { margin: 4px 0; font-size: 13.5px; }
.recup__aviso { background: #fdeaea; color: var(--cor-primaria-escura); border-radius: 8px; padding: 8px 10px; }
.recup__aviso--nova { background: #e7effd; color: #1f4fa8; }
.recup__detalhe-veiculos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.recup__detalhe-veiculos li { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--cor-borda); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.recup__acoes { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .recup__veiculo { grid-template-columns: 1fr 1fr; }
  .recup__veiculo-nome { grid-column: 1 / -1; }
  .recup__veiculo > span[data-rotulo]:not(.recup__veiculo-nome)::before {
    content: attr(data-rotulo);
    display: block;
    font-size: 11px;
    color: var(--cor-texto-suave);
    font-weight: 400;
  }
}
@media (max-width: 640px) {
  .recup__demanda { padding: 10px 12px; }
  .recup__rodape .side-panel__botao-secundario { width: 100%; }
  .recup__acoes .side-panel__botao-secundario { width: 100%; }
}
/* Melhoria 10 / C2 — registro rápido de contato (mobile-first; alvos de toque >= 44px) */

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#111111" />
<title>Companycar CRM — Preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d62828'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --cor-primaria: #d62828;
    --cor-primaria-escura: #a81f1f;
    --cor-fundo: #f5f5f7;
    --cor-texto: #111114;
    --cor-texto-suave: #6b6b70;
    --cor-borda: #e3e3e6;
    --sombra-card: 0 1px 2px rgba(0, 0, 0, 0.06), 0 1px 1px rgba(0, 0, 0, 0.04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cor-fundo); color: var(--cor-texto); }
  button { font-family: inherit; }

  #banner-preview { background: #111114; color: #fff; font-size: 12px; text-align: center; padding: 6px 10px; }
  #banner-preview strong { color: #ffb703; }

  .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
  .app-header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 24px; background: #fff; border-bottom: 1px solid var(--cor-borda);
    position: sticky; top: 0; z-index: 20;
  }
  .app-header__brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .app-header__logo { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
  .app-header__badge {
    font-size: 11px; color: var(--cor-texto-suave); background: var(--cor-fundo);
    border: 1px solid var(--cor-borda); border-radius: 999px; padding: 2px 8px;
  }
  .app-nav { display: flex; gap: 4px; flex: 1; justify-content: center; }
  .app-nav button {
    text-decoration: none; color: var(--cor-texto-suave); font-size: 14px; font-weight: 600;
    padding: 8px 14px; border-radius: 8px; background: none; border: none; cursor: pointer;
  }
  .app-nav button.ativo { color: var(--cor-primaria); background: rgba(214, 40, 40, 0.08); }
  .app-header__usuario { display: flex; align-items: center; gap: 12px; }
  .app-header__avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--cor-primaria); color: #fff;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .app-header__menu-btn {
    display: none; background: none; border: 1px solid var(--cor-borda); border-radius: 8px;
    width: 34px; height: 34px; font-size: 16px; cursor: pointer;
  }
  .app-content { flex: 1; min-width: 0; }

  .dashboard { padding: 24px; max-width: 960px; margin: 0 auto; }
  .dashboard h1 { margin: 0 0 4px; font-size: 24px; }
  .dashboard__subtitulo { margin: 0 0 24px; color: var(--cor-texto-suave); }
  .dashboard__cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .dashboard__card { background: #fff; border: 1px solid var(--cor-borda); border-radius: 12px; padding: 16px; box-shadow: var(--sombra-card); }
  .dashboard__card-label { display: block; font-size: 12px; color: var(--cor-texto-suave); margin-bottom: 6px; }
  .dashboard__card-valor { font-size: 26px; font-weight: 700; }
  .dashboard__card-valor small { font-size: 14px; font-weight: 500; color: var(--cor-texto-suave); }
  .dashboard__barra { margin-top: 10px; height: 6px; border-radius: 999px; background: var(--cor-fundo); overflow: hidden; }
  .dashboard__barra-preenchida { height: 100%; background: var(--cor-primaria); }
  .dashboard__cta {
    display: inline-block; background: var(--cor-primaria); color: #fff; text-decoration: none;
    font-weight: 600; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px;
  }
  .dashboard__cta:hover { background: var(--cor-primaria-escura); }

  .pipeline__board { display: flex; gap: 14px; padding: 16px; overflow-x: auto; scroll-snap-type: x proximity; }
  .pipeline__coluna {
    flex: 0 0 260px; scroll-snap-align: start; background: #eef0f2; border-radius: 12px;
    display: flex; flex-direction: column; max-height: calc(100vh - 120px);
  }
  .pipeline__coluna--ganho { background: #e7f5ea; }
  .pipeline__coluna--perdido { background: #f5e9e9; }
  .pipeline__coluna-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 6px; }
  .pipeline__coluna-header h2 { font-size: 13px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: 0.02em; color: var(--cor-texto-suave); }
  .pipeline__contagem { font-size: 12px; font-weight: 700; background: #fff; border-radius: 999px; padding: 1px 8px; color: var(--cor-texto-suave); }
  .pipeline__coluna-cards { padding: 4px 10px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .pipeline__vazio { font-size: 12px; color: var(--cor-texto-suave); padding: 8px 4px; }

  .op-card {
    background: #fff; border: 1px solid var(--cor-borda); border-radius: 10px; padding: 12px;
    cursor: pointer; box-shadow: var(--sombra-card); display: flex; flex-direction: column; gap: 4px;
  }
  .op-card:hover { border-color: var(--cor-primaria); }
  .op-card__veiculo { font-size: 13.5px; }
  .op-card__cliente { margin: 0; font-size: 12.5px; color: var(--cor-texto); }
  .op-card__proxima { margin: 0; font-size: 12px; color: var(--cor-texto-suave); }
  .op-card__valor { margin-top: 4px; font-size: 12.5px; font-weight: 700; color: var(--cor-primaria-escura); }

  .side-panel__overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); display: flex; justify-content: flex-end; z-index: 30; }
  .side-panel { width: min(420px, 100%); height: 100%; background: #fff; display: flex; flex-direction: column; box-shadow: -4px 0 16px rgba(0, 0, 0, 0.12); animation: side-panel-in 0.18s ease-out; }
  @keyframes side-panel-in { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .side-panel__header { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 12px; border-bottom: 1px solid var(--cor-borda); }
  .side-panel__header h2 { margin: 0 0 4px; font-size: 17px; }
  .side-panel__cliente { margin: 0; color: var(--cor-texto-suave); font-size: 13px; }
  .side-panel__fechar { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--cor-texto-suave); }
  .side-panel__tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--cor-borda); }
  .side-panel__tabs button { background: none; border: none; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--cor-texto-suave); cursor: pointer; border-bottom: 2px solid transparent; }
  .side-panel__tabs button.ativo { color: var(--cor-primaria); border-bottom-color: var(--cor-primaria); }
  .side-panel__body { padding: 18px 20px; overflow-y: auto; }
  .side-panel__lista { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
  .side-panel__lista dt { font-size: 12px; color: var(--cor-texto-suave); }
  .side-panel__lista dd { margin: 0; font-size: 13.5px; text-align: right; }
  .side-panel__timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .side-panel__timeline li { display: flex; flex-direction: column; gap: 2px; padding-left: 14px; border-left: 2px solid var(--cor-borda); }
  .side-panel__timeline-data { font-size: 11px; color: var(--cor-texto-suave); text-transform: uppercase; }
  .side-panel__checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .side-panel__checklist label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }

  @media (max-width: 720px) {
    .app-header { padding: 10px 16px; flex-wrap: wrap; }
    .app-header__menu-btn { display: block; }
    .app-nav {
      order: 3; flex-basis: 100%; justify-content: flex-start; display: none; flex-direction: column;
      gap: 2px; padding-top: 8px; border-top: 1px solid var(--cor-borda); margin-top: 8px;
    }
    .app-nav--aberto { display: flex; }
    .app-nav button { padding: 10px 8px; text-align: left; }
    .dashboard { padding: 16px; }
    .pipeline__board { scroll-snap-type: x mandatory; }
    .pipeline__coluna { flex-basis: 84vw; max-height: calc(100vh - 150px); }
    .side-panel { width: 100%; }
  }
</style>
</head>
<body>
<div id="banner-preview">Companycar CRM · <strong>preview com dados fictícios</strong> — layout e navegação para validação, sem gravar na planilha</div>
<div id="root"></div>

<script>
"use strict";

// ---------- Dados fictícios ----------
var USUARIOS = [
  { id: "u1", nome: "Guilherme", papel: "Gerencia" },
  { id: "u2", nome: "Ian", papel: "Closer" },
  { id: "u3", nome: "Ramon", papel: "Closer" },
  { id: "u4", nome: "Ester", papel: "SDR" }
];

var ETAPAS = [
  { id: "e1", nome: "Novo Lead", ordem: 1, tipo: "ativa" },
  { id: "e2", nome: "Tentativa de Contato", ordem: 2, tipo: "ativa" },
  { id: "e3", nome: "Pré-qualificação", ordem: 3, tipo: "ativa" },
  { id: "e4", nome: "Cotação", ordem: 4, tipo: "ativa" },
  { id: "e5", nome: "Visita Agendada", ordem: 5, tipo: "ativa" },
  { id: "e6", nome: "Negociação Final", ordem: 6, tipo: "ativa" },
  { id: "e7", nome: "Venda/Documentação", ordem: 7, tipo: "ganho" },
  { id: "e8", nome: "Perdido", ordem: 8, tipo: "perdido" }
];

var CLIENTES = [
  { id: "c1", nome: "Marcos Vieira", telefone: "(48) 99911-2233", cidade: "Içara" },
  { id: "c2", nome: "Fernanda Bez", telefone: "(48) 99822-1144", cidade: "Criciúma" },
  { id: "c3", nome: "Rodrigo Cardoso", telefone: "(48) 99733-5566", cidade: "Araranguá" },
  { id: "c4", nome: "Juliana Menegatti", telefone: "(48) 99644-7788", cidade: "Içara" },
  { id: "c5", nome: "Anderson Kuhn", telefone: "(48) 99555-9900", cidade: "Forquilhinha" },
  { id: "c6", nome: "Patrícia Souza", telefone: "(48) 99466-1122", cidade: "Sombrio" },
  { id: "c7", nome: "Elton Zanette", telefone: "(48) 99377-3344", cidade: "Criciúma" },
  { id: "c8", nome: "Camila Duarte", telefone: "(48) 99288-5566", cidade: "Içara" },
  { id: "c9", nome: "Vinícius Ghisi", telefone: "(48) 99199-7788", cidade: "Criciúma" },
  { id: "c10", nome: "Bruna Fernandes", telefone: "(48) 99099-9911", cidade: "Içara" },
  { id: "c11", nome: "Diego Bittencourt", telefone: "(48) 98988-2211", cidade: "Araranguá" },
  { id: "c12", nome: "Tainara Corrêa", telefone: "(48) 98877-3322", cidade: "Içara" }
];

var MOTIVOS_PERDA = { m1: "Fechou com concorrente", m2: "Não aprovado no crédito" };

var OPORTUNIDADES = [
  { id: "o1", clienteId: "c1", etapaId: "e1", responsavelId: "u4", proximaAcao: "Fazer primeiro contato via WhatsApp", veiculoInteresse: "HB20 1.0 2021" },
  { id: "o2", clienteId: "c2", etapaId: "e1", responsavelId: "u4", proximaAcao: "Enviar catálogo de SUVs disponíveis", veiculoInteresse: "Jeep Renegade 2020" },
  { id: "o3", clienteId: "c3", etapaId: "e2", responsavelId: "u4", proximaAcao: "Ligar novamente às 14h", veiculoInteresse: "Chevrolet Onix 1.0 2022" },
  { id: "o4", clienteId: "c4", etapaId: "e2", responsavelId: "u4", proximaAcao: "Tentar contato por ligação", veiculoInteresse: "Fiat Argo 1.3 2021" },
  { id: "o5", clienteId: "c5", etapaId: "e3", responsavelId: "u2", proximaAcao: "Entender uso do veículo e forma de pagamento", veiculoInteresse: "Fiat Strada 1.4 2020" },
  { id: "o6", clienteId: "c6", etapaId: "e3", responsavelId: "u3", proximaAcao: "Confirmar se tem veículo na troca", veiculoInteresse: "Renault Kwid 1.0 2022" },
  { id: "o7", clienteId: "c7", etapaId: "e4", responsavelId: "u2", proximaAcao: "Enviar proposta com condições de financiamento", veiculoInteresse: "Toyota Corolla 2.0 2019", veiculoTroca: { modelo: "Ford Ka 2016", ano: 2016, km: 78000 }, condicaoComercial: "Financiado 48x", valorProposto: 98900 },
  { id: "o8", clienteId: "c8", etapaId: "e4", responsavelId: "u3", proximaAcao: "Ajustar valor da entrada conforme pedido", veiculoInteresse: "Jeep Compass 1.3 2021", condicaoComercial: "Financiado 60x", valorProposto: 132900 },
  { id: "o9", clienteId: "c9", etapaId: "e5", responsavelId: "u2", proximaAcao: "Confirmar presença na visita de amanhã", veiculoInteresse: "Volkswagen Saveiro 1.6 2020", condicaoComercial: "À vista", valorProposto: 84900 },
  { id: "o10", clienteId: "c10", etapaId: "e5", responsavelId: "u3", proximaAcao: "Preparar veículo para test-drive", veiculoInteresse: "Honda Civic 2.0 2018", condicaoComercial: "Financiado 36x", valorProposto: 89900 },
  { id: "o11", clienteId: "c11", etapaId: "e6", responsavelId: "u2", proximaAcao: "Fechar condição final de troca", veiculoInteresse: "Chevrolet Onix 1.0 2023", veiculoTroca: { modelo: "HB20 2017", ano: 2017, km: 95000 }, condicaoComercial: "Troca + financiamento 48x", valorProposto: 79900 },
  { id: "o12", clienteId: "c12", etapaId: "e6", responsavelId: "u3", proximaAcao: "Aguardar retorno sobre aprovação de crédito", veiculoInteresse: "Hyundai Creta 1.6 2021", condicaoComercial: "Financiado 60x", valorProposto: 118900 },
  { id: "o13", clienteId: "c1", etapaId: "e7", responsavelId: "u2", proximaAcao: "Enviar documentação para o despachante", veiculoInteresse: "Fiat Toro 2.0 2020", condicaoComercial: "Financiado 48x", valorProposto: 139900 },
  { id: "o14", clienteId: "c2", etapaId: "e7", responsavelId: "u3", proximaAcao: "Agendar entrega do veículo", veiculoInteresse: "Chevrolet Tracker 1.0 2022", condicaoComercial: "À vista", valorProposto: 109900 },
  { id: "o15", clienteId: "c3", etapaId: "e8", responsavelId: "u2", proximaAcao: "—", veiculoInteresse: "Renault Sandero 1.6 2019", motivoPerdaId: "m1" },
  { id: "o16", clienteId: "c4", etapaId: "e8", responsavelId: "u3", proximaAcao: "—", veiculoInteresse: "Fiat Cronos 1.3 2021", motivoPerdaId: "m2" }
];

var META_CARROS_MES = 30;
var TIMELINE_PLACEHOLDER = [
  { data: "hoje", texto: "Oportunidade atualizada" },
  { data: "ontem", texto: "Contato registrado com o cliente" },
  { data: "há 3 dias", texto: "Oportunidade criada" }
];
var CHECKLIST_PLACEHOLDER = [
  { texto: "Documentos do cliente conferidos", feito: true },
  { texto: "Veículo de troca avaliado", feito: false },
  { texto: "Condição comercial aprovada", feito: false }
];

function formatoMoeda(v) {
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function clientePorId(id) { return CLIENTES.filter(function (c) { return c.id === id; })[0]; }
function usuarioPorId(id) { return USUARIOS.filter(function (u) { return u.id === id; })[0]; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// ---------- Estado ----------
var state = { vista: "dashboard", menuAberto: false, selecionadaId: null, aba: "detalhes" };
var usuarioAtual = USUARIOS[0];

function irPara(vista) { state.vista = vista; state.menuAberto = false; render(); }
function toggleMenu() { state.menuAberto = !state.menuAberto; render(); }
function abrirOportunidade(id) { state.selecionadaId = id; state.aba = "detalhes"; render(); }
function fecharPainel() { state.selecionadaId = null; render(); }
function mudarAba(aba) { state.aba = aba; render(); }

// ---------- Render ----------
function renderHeader() {
  return (
    '<header class="app-header">' +
      '<div class="app-header__brand">' +
        '<span class="app-header__logo">Companycar</span>' +
        '<span class="app-header__badge">CRM · preview</span>' +
      "</div>" +
      '<nav class="app-nav' + (state.menuAberto ? " app-nav--aberto" : "") + '">' +
        '<button class="' + (state.vista === "dashboard" ? "ativo" : "") + '" onclick="irPara(\'dashboard\')">Dashboard</button>' +
        '<button class="' + (state.vista === "pipeline" ? "ativo" : "") + '" onclick="irPara(\'pipeline\')">Pipeline</button>' +
      "</nav>" +
      '<div class="app-header__usuario">' +
        '<span class="app-header__avatar" title="' + escapeHtml(usuarioAtual.nome) + '">' + escapeHtml(usuarioAtual.nome.charAt(0)) + "</span>" +
        '<button class="app-header__menu-btn" onclick="toggleMenu()" aria-label="Abrir menu">☰</button>' +
      "</div>" +
    "</header>"
  );
}

function renderDashboard() {
  var ativas = OPORTUNIDADES.filter(function (o) {
    var etapa = ETAPAS.filter(function (e) { return e.id === o.etapaId; })[0];
    return etapa && etapa.tipo === "ativa";
  });
  var vendidas = OPORTUNIDADES.filter(function (o) {
    var etapa = ETAPAS.filter(function (e) { return e.id === o.etapaId; })[0];
    return etapa && etapa.tipo === "ganho";
  });
  var perdidas = OPORTUNIDADES.filter(function (o) {
    var etapa = ETAPAS.filter(function (e) { return e.id === o.etapaId; })[0];
    return etapa && etapa.tipo === "perdido";
  });
  var totalFechadas = vendidas.length + perdidas.length;
  var taxaConversao = totalFechadas > 0 ? Math.round((vendidas.length / totalFechadas) * 100) : 0;
  var progressoMeta = Math.min(100, Math.round((vendidas.length / META_CARROS_MES) * 100));

  return (
    '<div class="dashboard">' +
      "<h1>Olá, " + escapeHtml(usuarioAtual.nome) + "</h1>" +
      '<p class="dashboard__subtitulo">Resumo rápido do funil comercial de hoje.</p>' +
      '<div class="dashboard__cards">' +
        '<div class="dashboard__card"><span class="dashboard__card-label">Oportunidades ativas</span><strong class="dashboard__card-valor">' + ativas.length + "</strong></div>" +
        '<div class="dashboard__card"><span class="dashboard__card-label">Vendas no mês</span><strong class="dashboard__card-valor">' + vendidas.length + " <small>/ " + META_CARROS_MES + '</small></strong><div class="dashboard__barra"><div class="dashboard__barra-preenchida" style="width:' + progressoMeta + '%"></div></div></div>' +
        '<div class="dashboard__card"><span class="dashboard__card-label">Taxa de conversão</span><strong class="dashboard__card-valor">' + taxaConversao + "%</strong></div>" +
        '<div class="dashboard__card"><span class="dashboard__card-label">Perdidas no período</span><strong class="dashboard__card-valor">' + perdidas.length + "</strong></div>" +
      "</div>" +
      '<button class="dashboard__cta" onclick="irPara(\'pipeline\')">Ver Pipeline completo →</button>' +
    "</div>"
  );
}

function renderCard(o) {
  var cliente = clientePorId(o.clienteId);
  var valorHtml = o.valorProposto ? '<span class="op-card__valor">' + formatoMoeda(o.valorProposto) + "</span>" : "";
  return (
    '<article class="op-card" onclick="abrirOportunidade(\'' + o.id + '\')" role="button" tabindex="0">' +
      '<strong class="op-card__veiculo">' + escapeHtml(o.veiculoInteresse) + "</strong>" +
      '<p class="op-card__cliente">' + escapeHtml(cliente ? cliente.nome : "Cliente não identificado") + "</p>" +
      '<p class="op-card__proxima">' + escapeHtml(o.proximaAcao) + "</p>" +
      valorHtml +
    "</article>"
  );
}

function renderPipeline() {
  var etapasOrdenadas = ETAPAS.slice().sort(function (a, b) { return a.ordem - b.ordem; });
  var colunas = etapasOrdenadas.map(function (etapa) {
    var ops = OPORTUNIDADES.filter(function (o) { return o.etapaId === etapa.id; });
    var cardsHtml = ops.length === 0
      ? '<p class="pipeline__vazio">Sem oportunidades</p>'
      : ops.map(renderCard).join("");
    return (
      '<section class="pipeline__coluna pipeline__coluna--' + etapa.tipo + '">' +
        '<header class="pipeline__coluna-header"><h2>' + escapeHtml(etapa.nome) + '</h2><span class="pipeline__contagem">' + ops.length + "</span></header>" +
        '<div class="pipeline__coluna-cards">' + cardsHtml + "</div>" +
      "</section>"
    );
  }).join("");

  return '<div class="pipeline"><div class="pipeline__board">' + colunas + "</div></div>";
}

function renderSidePanel() {
  if (!state.selecionadaId) return "";
  var o = OPORTUNIDADES.filter(function (x) { return x.id === state.selecionadaId; })[0];
  if (!o) return "";
  var cliente = clientePorId(o.clienteId);
  var responsavel = usuarioPorId(o.responsavelId);
  var motivoPerda = o.motivoPerdaId ? MOTIVOS_PERDA[o.motivoPerdaId] : null;

  var detalhes = (
    '<dl class="side-panel__lista">' +
      "<dt>Responsável</dt><dd>" + escapeHtml(responsavel ? responsavel.nome : "—") + "</dd>" +
      "<dt>Telefone</dt><dd>" + escapeHtml(cliente ? cliente.telefone : "—") + "</dd>" +
      "<dt>Cidade</dt><dd>" + escapeHtml(cliente ? cliente.cidade : "—") + "</dd>" +
      "<dt>Próxima ação</dt><dd>" + escapeHtml(o.proximaAcao) + "</dd>" +
      (o.condicaoComercial ? "<dt>Condição comercial</dt><dd>" + escapeHtml(o.condicaoComercial) + "</dd>" : "") +
      (o.valorProposto ? "<dt>Valor proposto</dt><dd>" + formatoMoeda(o.valorProposto) + "</dd>" : "") +
      (o.veiculoTroca ? "<dt>Veículo na troca</dt><dd>" + escapeHtml(o.veiculoTroca.modelo) + " · " + o.veiculoTroca.ano + " · " + o.veiculoTroca.km.toLocaleString("pt-BR") + " km</dd>" : "") +
      (motivoPerda ? "<dt>Motivo da perda</dt><dd>" + escapeHtml(motivoPerda) + "</dd>" : "") +
    "</dl>"
  );

  var timeline = '<ul class="side-panel__timeline">' + TIMELINE_PLACEHOLDER.map(function (e) {
    return '<li><span class="side-panel__timeline-data">' + escapeHtml(e.data) + "</span><span>" + escapeHtml(e.texto) + "</span></li>";
  }).join("") + "</ul>";

  var checklist = '<ul class="side-panel__checklist">' + CHECKLIST_PLACEHOLDER.map(function (item) {
    return '<li><label><input type="checkbox" ' + (item.feito ? "checked" : "") + ' readonly onclick="return false;">' + escapeHtml(item.texto) + "</label></li>";
  }).join("") + "</ul>";

  var corpo = state.aba === "detalhes" ? detalhes : state.aba === "timeline" ? timeline : checklist;

  return (
    '<div class="side-panel__overlay" onclick="fecharPainel()">' +
      '<aside class="side-panel" onclick="event.stopPropagation()">' +
        '<div class="side-panel__header"><div><h2>' + escapeHtml(o.veiculoInteresse) + "</h2><p class=\"side-panel__cliente\">" + escapeHtml(cliente ? cliente.nome : "Cliente não identificado") + "</p></div>" +
        '<button class="side-panel__fechar" onclick="fecharPainel()" aria-label="Fechar">✕</button></div>' +
        '<div class="side-panel__tabs">' +
          '<button class="' + (state.aba === "detalhes" ? "ativo" : "") + '" onclick="mudarAba(\'detalhes\')">Detalhes</button>' +
          '<button class="' + (state.aba === "timeline" ? "ativo" : "") + '" onclick="mudarAba(\'timeline\')">Timeline</button>' +
          '<button class="' + (state.aba === "checklist" ? "ativo" : "") + '" onclick="mudarAba(\'checklist\')">Checklist</button>' +
        "</div>" +
        '<div class="side-panel__body">' + corpo + "</div>" +
      "</aside>" +
    "</div>"
  );
}

function render() {
  var conteudo = state.vista === "dashboard" ? renderDashboard() : renderPipeline();
  document.getElementById("root").innerHTML =
    '<div class="app-shell">' + renderHeader() + '<main class="app-content">' + conteudo + "</main></div>" + renderSidePanel();
}

render();
</script>
</body>
</html>
